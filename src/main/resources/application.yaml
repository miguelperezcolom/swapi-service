server:
  port: ${SERVER_PORT:8120}

spring:
  application:
    name: swapi-service

  # In memory on purpose: the dataset is re-seeded on every boot, so a public writable demo forgets
  # whatever anybody scribbled on it the moment the pod restarts. DB_URL can point elsewhere, but
  # nothing here assumes it.
  datasource:
    url: ${DB_URL:jdbc:h2:mem:swapi;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:create-drop}
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  h2:
    console:
      enabled: ${H2_CONSOLE:false}

  # Boot 4 ships Jackson 3 (tools.jackson), where the date-format flags moved out of
  # SerializationFeature — and its default for a java.time value is already ISO-8601, which is what
  # this API publishes. Nothing to set.
  jackson:
    default-property-inclusion: always

swapi:
  # The header carrying the write key. A custom header is what makes a browser write a "non-simple"
  # request, so it is also named in the CORS allowed headers — see WebConfig.
  write-key-header: ${WRITE_KEY_HEADER:X-Api-Key}
  # No default on purpose: an unset key refuses every write rather than allowing them.
  write-key: ${WRITE_KEY:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    io.mateu.swapi: INFO
